#change order service running port
server:
  port: 8550
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        file-extension: yml
        namespace: ${spring.profiles.active}
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: ${spring.profiles.active}
        username: nacos
        password: nacos
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_order
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8888/realms/ecommerce"