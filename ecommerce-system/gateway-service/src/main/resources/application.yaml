server:
  port: 8585

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8888/realms/ecommerce
        registration:
          ecommerce-postman:
            provider: keycloak
            client-id: ecommerce-postman
            #client-secret: secret
            scope:
              - openid
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8585/login/oauth2/code/ecommerce-postman"
  cloud:
    nacos:
      config:
        file-extension: yml
        namespace: ${spring.profiles.active}
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: ${spring.profiles.active}
        username: nacos
        password: nacos
    gateway:
      server:
        webflux:
          routes:
#            - id: vueJs
#              uri: http://[::1]:5173
#              predicates:
#                - Path=/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          trusted-proxies: ".*"
          default-filters:
            - SaveSession
            - TokenRelay=
management:
  endpoints:
    web:
      exposure:
        include: 'health,info,gateway'
  endpoint:
    gateway:
      access: read_only
springdoc:
  swagger-ui:
    urls:
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: User Service
        url: /user-service/v3/api-docs
    #enabled: false
    #api-docs:
    #enabled: false